name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to receive the Windows installer'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with warnings as errors
        shell: pwsh
        run: dotnet build windows/LectureCopilot.Windows/LectureCopilot.Windows.csproj -c Release -warnaserror -p:SelfContained=false -p:PublishSingleFile=false

      - name: Publish self-contained application
        shell: pwsh
        run: dotnet publish windows/LectureCopilot.Windows/LectureCopilot.Windows.csproj -c Release -r win-x64 --self-contained true -o windows/dist/win-x64

      - name: Run non-interactive self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'windows/dist/win-x64/Lecture Copilot.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and checksum
        shell: pwsh
        run: ./windows/build.ps1

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $setup = 'windows/dist/installer/Lecture-Copilot-Windows-x64-Setup.exe'
          $checksum = "$setup.sha256"
          $expected = (Get-Content $checksum -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Installer checksum verification failed' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Lecture-Copilot-Windows-x64
          if-no-files-found: error
          path: |
            windows/dist/installer/Lecture-Copilot-Windows-x64-Setup.exe
            windows/dist/installer/Lecture-Copilot-Windows-x64-Setup.exe.sha256

      - name: Add installer to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ inputs.release_tag }}' `
            'windows/dist/installer/Lecture-Copilot-Windows-x64-Setup.exe' `
            'windows/dist/installer/Lecture-Copilot-Windows-x64-Setup.exe.sha256' `
            --repo '${{ github.repository }}' --clobber
